[package]
name = "excelmerger"
version = "1.0.0"
description = "ExcelMerger desktop application"
authors = ["Technology Dev"]
edition = "2021"

[lib]
name = "excelmerger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
parking_lot = "0.12"
once_cell = "1"
